# Starter tokenomics.toml — written by `tok init`. Edit to add your accounts, then run
# `tok validate` to check it. Lives at ~/.config/tokenomics/tokenomics.toml ($TOKENOMICS_CONFIG overrides).

[settings]
# Claude usage is read natively, in-process, from each account's config_dir: streaming, mtime-pruned
# to the last 24h, with a per-file incremental cache — and N accounts whose config_dirs share one
# transcripts tree (symlinked projects/) share a single scan per tick. Raise this for big histories
# or account fleets only if you've set ccusage_cmd below to opt into the (slower) subprocess lane.
poll_local_secs = 60      # local poll cadence (native transcript scan / Codex sessions tree)
# ccusage_cmd = ["ccusage"]   # opt-in: use the ccusage subprocess lane instead of the native scanner
poll_overlay_secs = 300   # overlay poll cadence (only used by accounts with the overlay on)
warn_pct = 75.0           # window utilization % → warning
crit_pct = 90.0           # window utilization % → critical

[[account]]
id = "claude-personal"
label = "Personal"
provider = "claude"
config_dir = "~/.claude"  # this account's CLAUDE_CONFIG_DIR — attribution comes from the dir
limits_overlay = false    # opt-in, OFF by default — see the README overlay notice (undocumented
                          # Anthropic endpoint; using your OAuth token there is at your own ToS risk)

# A second provider — Codex reads its local sessions tree under CODEX_HOME.
# Uncomment and adjust to monitor an OpenAI Codex subscription too:
# [[account]]
# id = "codex-work"
# label = "Codex"
# provider = "codex"
# config_dir = "~/.codex"

# A third provider — z.ai (GLM coding plan) has no local usage lane yet, so it's limits-only.
# Uncomment and adjust to monitor a z.ai subscription too:
# [[account]]
# id = "zai-lite"
# label = "z.ai GLM"
# provider = "zai"
# api_key_env = "Z_AI_CODING_KEY"  # NAME of the env var holding your z.ai API key — never the key itself
# limits_overlay = true            # zai has no local usage lane; opt in to see any gauges at all

# A fourth provider — Gemini CLI reads its local chats tree under GEMINI_CLI_HOME. Usage-only: no
# scriptable limits surface exists, so both gauges always show n/a (never a fabricated daily quota).
# Uncomment and adjust to monitor a Gemini subscription too:
# [[account]]
# id = "gemini-personal"
# label = "Gemini"
# provider = "gemini"
# config_dir = "~/.gemini"  # this account's GEMINI_CLI_HOME — attribution comes from the dir

# A fifth provider — Grok Build CLI logs inference events under GROK_HOME. Usage comes from
# inference events; the WEEKLY gauge comes from the same log's billing lines (the CLI's own
# weekly-quota %, spec 022) — local reads only, no network, nothing to opt into. The session
# gauge stays n/a (Grok exposes no session-window surface).
# Uncomment and adjust to monitor a SuperGrok subscription too:
# [[account]]
# id = "grok-heavy"
# label = "Grok"
# provider = "grok"
# config_dir = "~/.grok"  # this account's GROK_HOME — attribution comes from the dir

# A sixth provider — Kimi (Moonshot AI coding plan) has no local usage lane, so it's limits-only.
# Signups are currently paused: with the named env var unset the account stays dormant (skipped
# with a logged reason). Uncomment and adjust once you hold a Kimi subscription key (sk-kimi-…):
# [[account]]
# id = "kimi-k2"
# label = "Kimi"
# provider = "kimi"
# api_key_env = "KIMI_CODING_KEY"  # NAME of the env var holding your Kimi subscription key — never the key itself
# limits_overlay = true            # kimi has no local usage lane; opt in to see any gauges at all

# ── API billing plane (spec 024) — real-dollar PAYG balances & month-to-date spend ────────────
# A separate plane from the subscription `[[account]]` list above: API-key accounts whose numbers
# are real money (a bill or a balance), never the notional proxy. Absent/unset ⇒ the plane is Off.
# Add these two `[settings]` keys only if you turn the plane on:
# [settings]
# poll_billing_secs = 3600            # how often the collector polls billing endpoints (floor 300s)
# api_manual_path = "~/tokenomics/api-billing.toml"  # manual TOML for providers with no billing endpoint
#                                                    # (gemini, xAI); optional, a leading ~ expands against $HOME

# Uncomment one block per API-key account. `api_key_env` is the NAME of the env var holding the key
# (e.g. ANTHROPIC_ADMIN_API_KEY) — never the key itself. Pollable providers (anthropic/openai/
# moonshot/xai) require it; gemini rejects it (manual-only).

# Anthropic — admin billing API; month-to-date spend from the cost report.
# [[api]]
# id = "anthropic-org"
# label = "Anthropic Org"
# provider = "anthropic"
# api_key_env = "ANTHROPIC_ADMIN_API_KEY"  # NAME of the env var holding your Anthropic admin key — never the key itself

# OpenAI — admin billing API; month-to-date spend summed from daily cost buckets.
# [[api]]
# id = "openai-org"
# label = "OpenAI Org"
# provider = "openai"
# api_key_env = "OPENAI_ADMIN_API_KEY"     # NAME of the env var holding your OpenAI admin key — never the key itself

# Gemini — AI Studio personal tier has no billing endpoint, so it is MANUAL-ONLY: no api_key_env,
# figures come from `api_manual_path` above.
# [[api]]
# id = "gemini-studio"
# label = "Gemini Studio"
# provider = "gemini"

# Moonshot (Kimi) — balance endpoint; current available balance.
# [[api]]
# id = "moonshot"
# label = "Moonshot"
# provider = "moonshot"
# api_key_env = "MOONSHOT_API_KEY"         # NAME of the env var holding your Moonshot API key — never the key itself

# xAI — ships DORMANT this wave (no management key on disk): config-accepted, never fetched until a
# follow-up spec adds the management-API fetcher. The named env var being unset is the expected state.
# [[api]]
# id = "xai"
# label = "xAI"
# provider = "xai"
# api_key_env = "XAI_API_KEY"              # NAME of the env var holding your xAI management key — never the key itself
